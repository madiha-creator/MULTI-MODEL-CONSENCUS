<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Drift Visualization</title>
<style>
  body {
    background: #0B1220;
    color: #E5E7EB;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h2 { color: #22D3EE; margin-bottom: 4px; }
  p.sub { color: #94A3B8; margin-top: 0; font-size: 13px; }
  canvas {
    background: #131C2E;
    border: 1px solid #1E293B;
    border-radius: 8px;
    margin-top: 16px;
  }
  .summary {
    display: flex;
    gap: 16px;
    margin-top: 16px;
  }
  .stat-card {
    background: #131C2E;
    border: 1px solid #1E293B;
    border-radius: 8px;
    padding: 10px 18px;
    text-align: center;
    min-width: 120px;
  }
  .stat-card .label { font-size: 12px; color: #94A3B8; }
  .stat-card .value { font-family: monospace; font-size: 22px; font-weight: bold; }
  #connStatus { margin-top: 10px; font-family: monospace; font-size: 13px; }
  .connected { color: #4ADE80; }
  .disconnected { color: #F87171; }
</style>
</head>
<body>

<h2>Multi-Modal Consensus Broker — Live Drift Visualization</h2>
<p class="sub">Real-time vision vs depth sensor arbitration, via ws://localhost:8080</p>
<div id="connStatus" class="disconnected">Connecting...</div>

<div class="summary">
  <div class="stat-card">
    <div class="label">Nodes in Agreement</div>
    <div class="value" id="agreeCount" style="color:#4ADE80;">0</div>
  </div>
  <div class="stat-card">
    <div class="label">Nodes in Drift</div>
    <div class="value" id="driftCount" style="color:#F87171;">0</div>
  </div>
  <div class="stat-card">
    <div class="label">Last Latency (ms)</div>
    <div class="value" id="lastLatency" style="color:#FBBF24;">--</div>
  </div>
</div>

<canvas id="driftCanvas" width="600" height="400"></canvas>

<script>
  const canvas = document.getElementById('driftCanvas');
  const ctx = canvas.getContext('2d');
  const connStatus = document.getElementById('connStatus');
  const agreeCountEl = document.getElementById('agreeCount');
  const driftCountEl = document.getElementById('driftCount');
  const lastLatencyEl = document.getElementById('lastLatency');

  // Stores latest known state per nodeId: { camera: {...}, depth: {...}, arbitration: {...} }
  const nodeState = {};

  // Fixed screen positions per nodeId so the layout stays stable across frames
  const nodePositions = {};
  let nextSlot = 0;
  const slots = [
    { x: 150, y: 120 }, { x: 450, y: 120 },
    { x: 150, y: 300 }, { x: 450, y: 300 }
  ];

  function getPosition(nodeId) {
    if (!nodePositions[nodeId]) {
      nodePositions[nodeId] = slots[nextSlot % slots.length];
      nextSlot++;
    }
    return nodePositions[nodeId];
  }

  function connect() {
    const ws = new WebSocket('ws://localhost:8080');

    ws.onopen = () => {
      connStatus.textContent = 'Connected to live telemetry server';
      connStatus.className = 'connected';
    };

    ws.onclose = () => {
      connStatus.textContent = 'Disconnected — retrying in 2s...';
      connStatus.className = 'disconnected';
      setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      connStatus.textContent = 'Connection error';
      connStatus.className = 'disconnected';
    };

    ws.onmessage = (event) => {
      let packet;
      try {
        packet = JSON.parse(event.data);
      } catch (e) {
        return; // ignore malformed messages
      }

      if (packet.type !== 'TELEMETRY_ARBITRATED') return;

      const nodeId = packet.nodeId;
      if (!nodeState[nodeId]) nodeState[nodeId] = {};

      // Store this sensor's latest reading (camera or depth)
      if (packet.sensorType === 'camera' || packet.sensorType === 'depth') {
        nodeState[nodeId][packet.sensorType] = packet.coordinates;
      }

      // Store the latest arbitration result / latency, whatever fields exist
      if (packet.arbitration) {
        nodeState[nodeId].arbitration = packet.arbitration;
      }
      if (typeof packet.executionLatencyMs === 'number') {
        lastLatencyEl.textContent = packet.executionLatencyMs.toFixed(2);
      }

      draw();
    };
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let agreeCount = 0;
    let driftCount = 0;

    Object.keys(nodeState).forEach((nodeId) => {
      const state = nodeState[nodeId];
      const pos = getPosition(nodeId);

      const cam = state.camera;
      const depth = state.depth;

      // Determine drift using arbitration result if present, else fallback distance calc
      let disagreement = 0;
      let isDrift = false;

      if (state.arbitration && typeof state.arbitration.distance === 'number') {
        disagreement = state.arbitration.distance;
        isDrift = !!state.arbitration.disagreementDetected;
      } else if (cam && depth) {
        const dx = (depth.x ?? 0) - (cam.x ?? 0);
        const dy = (depth.y ?? 0) - (cam.y ?? 0);
        const dz = (depth.z ?? 0) - (cam.z ?? 0);
        disagreement = Math.sqrt(dx * dx + dy * dy + dz * dz);
        isDrift = disagreement > 4.0; // matches DRIFT_THRESHOLD default
      }

      if (isDrift) driftCount++; else agreeCount++;

      const lineColor = isDrift ? '#F87171' : '#4ADE80';
      const camX = pos.x, camY = pos.y;
      const depthX = pos.x + 40, depthY = pos.y + 20; // fixed small visual offset, real magnitude shown as text

      ctx.beginPath();
      ctx.moveTo(camX, camY);
      ctx.lineTo(depthX, depthY);
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(camX, camY, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#22D3EE';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(depthX, depthY, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#C084FC';
      ctx.fill();

      ctx.fillStyle = '#E5E7EB';
      ctx.font = '12px monospace';
      ctx.fillText(nodeId, camX - 20, camY - 20);
      ctx.fillStyle = lineColor;
      ctx.fillText(disagreement.toFixed(2) + ' drift', camX - 20, camY + 45);
    });

    agreeCountEl.textContent = agreeCount;
    driftCountEl.textContent = driftCount;
  }

  connect();
</script>

</body>
</html>
